# Tests automatiques des moteurs (ne publie rien : la mise en ligne reste le push sur main,
# publiée par GitHub Pages indépendamment de ce workflow).
name: Tests

on:
  push:             # toutes les branches, y compris main (n'empêche aucune mise en ligne)
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Moteurs Python (Python 3.12, SymPy 1.13.3 = Pyodide 0.27.7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer SymPy (mêmes versions que Pyodide 0.27.7) et pytest (outil de test seulement)
        run: python -m pip install --disable-pip-version-check sympy==1.13.3 mpmath==1.3.0 pytest pytest-xdist

      # pytest collecte les unittest.TestCase tels quels ; -n auto = un processus par cœur ; -rx liste les échecs attendus.
      - name: Tests Python
        run: |
          set -o pipefail
          python -m pytest tests/python -n auto -v -rx -p no:cacheprovider 2>&1 | tee sortie-tests.txt

      # Les tests marqués @expectedFailure documentent des bugs connus non corrigés :
      # on les affiche en avertissement et dans le résumé, pour qu'ils restent visibles.
      # Quand un de ces bugs est corrigé, le test devient « unexpected success » (pytest le compte en échec) et
      # l'étape précédente échoue : retirer alors @expectedFailure.
      - name: Bugs connus (échecs attendus)
        if: always()
        run: |
          grep -E "^XFAIL " sortie-tests.txt > attendus.txt || true
          {
            echo "## Bugs connus (tests marqués « échec attendu »)"
            echo
            if [ -s attendus.txt ]; then
              echo '```'
              cat attendus.txt
              echo '```'
            else
              echo "Aucun."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r ligne; do
            echo "::warning title=Bug connu (échec attendu)::$ligne"
          done < attendus.txt

  pages:
    name: Pages (Chrome sans interface, Pyodide 0.27.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances des tests de pages
        run: python -m pip install --disable-pip-version-check sympy==1.13.3 mpmath==1.3.0 websockets

      # Copie locale de Pyodide + SymPy (≈ 18 Mo), non versionnée : téléchargée une fois par version puis mise en cache. La clé change
      # avec le manifeste (version de Pyodide) et avec le script (liste des fichiers requis). Restauration et sauvegarde sont séparées :
      # la sauvegarde suit tout de suite le téléchargement, donc une copie complète est gardée même si les tests échouent ensuite
      # (avec actions/cache seul, rien n'est sauvegardé quand le job échoue). Chaque téléchargement est réessayé et vérifié (pyodide_local.py).
      - name: Cache de la copie locale de Pyodide
        id: cache-pyodide
        uses: actions/cache/restore@v4
        with:
          path: tests/pages/pyodide-local
          key: pyodide-local-${{ hashFiles('moteur/manifeste.json', 'tests/pages/pyodide_local.py') }}

      - name: Copie locale de Pyodide
        if: steps.cache-pyodide.outputs.cache-hit != 'true'
        run: python tests/pages/pyodide_local.py

      - name: Sauvegarde de la copie locale de Pyodide
        if: steps.cache-pyodide.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/pages/pyodide-local
          key: ${{ steps.cache-pyodide.outputs.cache-primary-key }}

      # Chrome est préinstallé sur ubuntu-latest ; KaTeX vient de jsDelivr, Pyodide de la copie locale.
      # Corpus réduit (3 entrées par outil dont une erreur) : le corpus complet (≈ 300 entrées) se lance en local.
      - name: Tests de pages
        env:
          CORPUS: reduit
        run: |
          google-chrome --version
          python -m unittest discover -s tests/pages -v
