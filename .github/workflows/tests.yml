# Tests automatiques des moteurs (ne publie rien : la mise en ligne reste le push sur main,
# publiée par GitHub Pages indépendamment de ce workflow).
name: Tests

on:
  push:             # toutes les branches, y compris main (n'empêche aucune mise en ligne)
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Moteurs Python (Python 3.12, SymPy 1.13.3 = Pyodide 0.27.7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer SymPy (mêmes versions que Pyodide 0.27.7)
        run: python -m pip install --disable-pip-version-check sympy==1.13.3 mpmath==1.3.0

      - name: Tests Python
        run: |
          set -o pipefail
          python -m unittest discover -s tests/python -v 2>&1 | tee sortie-tests.txt

      # Les tests marqués @expectedFailure documentent des bugs connus non corrigés :
      # on les affiche en avertissement et dans le résumé, pour qu'ils restent visibles.
      # Quand un de ces bugs est corrigé, le test devient « unexpected success » et
      # l'étape précédente échoue : retirer alors @expectedFailure.
      - name: Bugs connus (échecs attendus)
        if: always()
        run: |
          grep -B1 -E "\.\.\. expected failure$" sortie-tests.txt | grep -v "^--$" > attendus.txt || true
          {
            echo "## Bugs connus (tests marqués « échec attendu »)"
            echo
            if [ -s attendus.txt ]; then
              echo '```'
              cat attendus.txt
              echo '```'
            else
              echo "Aucun."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "\.\.\. expected failure$" sortie-tests.txt | while read -r ligne; do
            echo "::warning title=Bug connu (échec attendu)::$ligne"
          done

  pages:
    name: Pages (Chrome sans interface, Pyodide 0.27.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances des tests de pages
        run: python -m pip install --disable-pip-version-check sympy==1.13.3 mpmath==1.3.0 websockets

      # Chrome est préinstallé sur ubuntu-latest ; Pyodide et KaTeX viennent de jsDelivr.
      # Corpus réduit (3 entrées par outil dont une erreur) : le corpus complet (≈ 300 entrées) se lance en local.
      - name: Tests de pages
        env:
          CORPUS: reduit
        run: |
          google-chrome --version
          python -m unittest discover -s tests/pages -v
